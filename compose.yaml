name: devops-app

services:
  backend:
    image: devops-app-backend:alpine
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: devops-app-frontend:alpine
    build:
      context: ./src/frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  backend-data:
