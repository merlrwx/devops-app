# mise use python@3.13

[tools]
k3d = "latest"
k9s = "latest"
kubectl = "latest"
pre-commit = "latest"
python = "3.13"
ruff = "0.16.9"
trivy = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
APP_REPO = 'devops-app'
GITOPS_REPO = 'devops-app-gitops'

[hooks]
enter = "bash ./scripts/setup_project"

[tasks.k8s-setup-local]
description = "Set up a basic Kubernetes cluster for development that builds the local images and applies them"
run = "bash ./kubernetes/setup_cluster_local"

[tasks.k8s-setup-minimal]
description = "Set up a minimal local Kubernetes cluster without deploying workloads"
run = "bash ./kubernetes/setup_cluster_minimal"

[tasks.e2e-test]
description = "Run end-to-end tests for the Pomodoro app in a local k3d cluster"
run = "uv run --locked --project ./kubernetes python ./kubernetes/e2e_test.py"
