# mise use python@3.13

[tools]
flux2 = "latest"
gh = "latest"
k3d = "5.9.0"
k9s = "latest"
kubectl = "latest"
pre-commit = "latest"
python = "3.13"
ruff = "0.16.9"
trivy = "latest"
uv = "latest"

[settings]
python.uv_venv_auto = "create|source"
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[env]
APP_REPO = 'devops-app'
GITOPS_REPO = 'devops-app-gitops'
GITUSER = 'merlrwx'

[hooks]
enter = "bash ./scripts/setup_project"

[tasks.k8s-setup-local]
description = "Set up a basic Kubernetes cluster for development that builds the local images and applies them"
run = "bash ./kubernetes/setup_cluster_local"

[tasks.k8s-sync-local]
description = "Build and deploy local app changes into an existing non-Flux k3d cluster"
run = "bash ./kubernetes/sync_local"

[tasks.k8s-setup-minimal]
description = "Set up a minimal local Kubernetes cluster without deploying workloads"
run = "bash ./kubernetes/setup_cluster_minimal"

[tasks.e2e-test]
description = "Run end-to-end tests for the Pomodoro app in a local k3d cluster"
run = "uv run --locked --project ./kubernetes python ./kubernetes/e2e_test.py"

[tasks.setup-keys]
description = "Set up deploy key for repo"
run = "bash ./scripts/setup_deploy_key"

[tasks.setup-gitops]
description = "Bootstrap Flux from the configured GitOps repository"
run = "bash ./scripts/setup_gitops"

[tasks.setup-cluster-gitops]
description = "Create a local k3d cluster and bootstrap Flux"
run = "bash ./scripts/setup_cluster_gitops"

[tasks.k8s-status]
description = "Show application deployments, Pods and services in the local cluster"
run = "kubectl --context k3d-devops-app-cluster --namespace devops-app get deployments,pods,services"

[tasks.k8s-logs]
description = "Follow backend or frontend logs: mise run k8s-logs backend|frontend"
run = "bash ./kubernetes/logs"

[tasks.k8s-down-local]
description = "Delete devops-app-cluster, including its application data and Flux installation"
run = "bash ./kubernetes/down_local"
